name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pygame pyinstaller

      - name: Build Windows exe
        run: pyinstaller --onefile --windowed --name VampireSurvivorsClone main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/VampireSurvivorsClone.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pygame pyinstaller

      - name: Build Mac app
        run: pyinstaller --onefile --windowed --name VampireSurvivorsClone main.py

      - name: Zip Mac app
        run: zip -r VampireSurvivorsClone-Mac.zip dist/VampireSurvivorsClone

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: VampireSurvivorsClone-Mac.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download Mac build
        uses: actions/download-artifact@v4
        with:
          name: mac-build

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VampireSurvivorsClone.exe
            VampireSurvivorsClone-Mac.zip
          body: |
            ## 🧛 Vampire Survivors Clone

            ### Download
            - **Windows:** `VampireSurvivorsClone.exe` — download and run it directly.
            - **macOS:** `VampireSurvivorsClone-Mac.zip` — unzip it, then run the extracted file.

            ### Audio Settings
            Open **Settings** from the main menu to adjust four volume sliders:
            - **Master Volume** — overall volume for all audio.
            - **Music Volume** — background music.
            - **SFX Volume** — sound effects.
            - **Coin Volume** — coin pickup sound.

            Your volume levels are saved automatically when you release a slider or leave the Settings screen, and they are restored the next time you launch the game. Select a slider and use the Left/Right arrow keys to adjust it in steps of 5.

            ### Controls
            - `WASD` / Arrow keys → Move
            - `P` → Pause
            - `1` / `2` / `3` → Choose an upgrade
            - `M` → Toggle sound on/off
            - `L` → Switch language
            - `R` → Restart (after game over)
            - `ESC` → Back to menu / close panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
